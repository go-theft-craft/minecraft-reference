version: "3"

vars:
  MODULE:
    sh: go list -m
  VERSION: '{{.VERSION | default "dev"}}'
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || printf none
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  deps:
    desc: Download and normalize Go dependencies
    sources: [go.mod, go.sum]
    cmds:
      - go mod download
      - go mod tidy

  fmt:
    desc: Format Go source
    deps: [deps]
    cmds:
      - gci write -s standard -s default -s "prefix(github.com/go-theft-craft)" -s "prefix({{.MODULE}})" .
      - gofumpt -w .

  fmt:check:
    desc: Check Go formatting without changing files
    deps: [deps]
    cmds:
      - |
        formatting_diff="$(golangci-lint fmt --diff)"
        if [ -n "$formatting_diff" ]; then
          printf '%s\n' "$formatting_diff"
          exit 1
        fi

  lint:
    desc: Run static analysis
    deps: [fmt:check]
    cmds:
      - golangci-lint run

  test:
    desc: Run unit tests with the race detector
    deps: [deps]
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out {{.CLI_ARGS | default "./..."}}

  build:
    desc: Build mcreference
    deps: [deps]
    cmds:
      - >-
        go build -trimpath
        -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.BUILD_DATE}}"
        -o build/mcreference ./cmd/mcreference

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build release artifacts without publishing
    deps: [deps]
    cmds:
      - goreleaser release --snapshot --clean

  release:
    desc: Publish the current Git tag with GoReleaser
    deps: [deps]
    cmds:
      - goreleaser release --clean

  vuln:
    desc: Check dependencies for known vulnerabilities
    deps: [deps]
    cmds:
      - govulncheck ./...

  secrets:
    desc: Scan project files and Git history for secrets
    cmds:
      - gitleaks dir --config .gitleaks.toml --no-banner --redact --verbose .
      - gitleaks git --config .gitleaks.toml --no-banner --redact --verbose --log-opts="--all" .

  secrets:staged:
    desc: Scan staged changes for secrets
    cmds:
      - gitleaks git --config .gitleaks.toml --no-banner --redact --verbose --staged

  precommit:
    desc: Run checks required before a commit
    cmds:
      - task: lint
      - task: secrets:staged

  verify:
    desc: Run all local checks
    cmds:
      - task: lint
      - task: secrets
      - task: test
      - task: vuln
      - task: build
      - task: release:check
      - task: versions:check

  versions:check:
    desc: Check that README lists the configured Minecraft versions
    cmds:
      - go run ./cmd/mcversionupdate readme --config internal/reference/config/defaults/versions.json --file README.md --check

  versions:discover:
    desc: Discover changed stable family representatives
    vars:
      OUTPUT: '{{.OUTPUT | default "candidate.json"}}'
    cmds:
      - go run ./cmd/mcversionupdate discover --output '{{.OUTPUT}}'

  versions:matrix:
    desc: Print the configured compatibility matrix
    vars:
      CONFIG: '{{.CONFIG | default "internal/reference/config/defaults/versions.json"}}'
    cmds:
      - go run ./cmd/mcversionupdate matrix --config '{{.CONFIG}}'

  versions:accept:
    desc: Accept passing compatibility reports into a version catalog
    requires:
      vars: [CONFIG, REPORTS, OUTPUT]
    cmds:
      - >-
        go run ./cmd/mcversionupdate accept
        --config '{{.CONFIG}}'
        --reports '{{.REPORTS}}'
        --output '{{.OUTPUT}}'

  versions:readme:
    desc: Regenerate the supported Minecraft versions table
    vars:
      CONFIG: '{{.CONFIG | default "internal/reference/config/defaults/versions.json"}}'
      FILE: '{{.FILE | default "README.md"}}'
    cmds:
      - go run ./cmd/mcversionupdate readme --config '{{.CONFIG}}' --file '{{.FILE}}' --write

  compatibility:
    desc: Prepare compatibility evidence for selected Minecraft versions
    requires:
      vars: [VERSIONS]
    cmds:
      - task: reference:prepare
        vars:
          VERSIONS: '{{.VERSIONS}}'
          SIDES: '{{.SIDES | default "client,server"}}'
          JAVA: '{{.JAVA | default "java"}}'
          JAVAP: '{{.JAVAP | default "javap"}}'
          CONFIG_DIR: '{{.CONFIG_DIR | default ""}}'

  reference:prepare:
    desc: Download, name, decompile, and index Minecraft reference artifacts
    requires:
      vars: [VERSIONS]
    vars:
      SIDES: '{{.SIDES | default "client,server"}}'
      REFERENCE_DIR: '{{.REFERENCE_DIR | default "reference/work"}}'
      WORKSPACE: '{{.WORKSPACE | default "."}}'
      JAVA: '{{.JAVA | default "java"}}'
      JAVAP: '{{.JAVAP | default "javap"}}'
      CONFIG_DIR: '{{.CONFIG_DIR | default ""}}'
    cmds:
      - >-
        go run ./cmd/mcreference prepare
        --versions '{{.VERSIONS}}'
        --sides '{{.SIDES}}'
        --workspace '{{.WORKSPACE}}'
        --reference-dir '{{.REFERENCE_DIR}}'
        --java '{{.JAVA}}'
        --javap '{{.JAVAP}}'
        --config-dir '{{.CONFIG_DIR}}'

  reference:clean:
    desc: Remove the validated local reference workspace
    vars:
      REFERENCE_DIR: '{{.REFERENCE_DIR | default "reference/work"}}'
      WORKSPACE: '{{.WORKSPACE | default "."}}'
    cmds:
      - >-
        go run ./cmd/mcreference clean
        --workspace '{{.WORKSPACE}}'
        --reference-dir '{{.REFERENCE_DIR}}' --yes

  default:
    cmds:
      - task --list
