name: Compatibility

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      - name: Generate compatibility matrix
        id: matrix
        run: |
          matrix="$(devbox run -- task --silent versions:matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      # The pinned tools are the same jars for every version, so the whole
      # matrix shares one entry instead of storing 46 copies of Vineflower.
      # tools.json carries their versions and hashes.
      - name: Restore pinned tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/work/cache/tools
          key: reference-tools-${{ runner.os }}-${{ hashFiles('internal/reference/config/defaults/tools.json') }}

      # Mojang metadata is per version and immutable once released. It has
      # nothing to do with the pinned tools, so changing one no longer discards
      # the other.
      - name: Restore version metadata cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/work/cache/metadata
          key: reference-metadata-${{ runner.os }}-${{ matrix.version }}

      - name: Prepare reference
        env:
          JAVA_BIN: ${{ env.JAVA_HOME }}/bin/java
          JAVAP_BIN: ${{ env.JAVA_HOME }}/bin/javap
        run: >-
          devbox run -- task compatibility
          VERSIONS=${{ matrix.version }}
          SIDES=${{ matrix.side }}
          JAVA="$JAVA_BIN"
          JAVAP="$JAVAP_BIN"

      - name: Upload compatibility report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-${{ matrix.version }}-${{ matrix.side }}
          path: reference/work/versions/${{ matrix.version }}/${{ matrix.side }}/compatibility.json
          if-no-files-found: error
